name: WebGPU native build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build CPU path
        run: cmake --build build -j2
      - name: Test CPU path
        run: ctest --test-dir build --output-on-failure

  webgpu-compile-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install software Vulkan runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools

      - name: Build pinned wgpu-native
        shell: bash
        run: |
          git clone https://github.com/gfx-rs/wgpu-native.git /tmp/wgpu-native
          cd /tmp/wgpu-native
          git checkout 250eeb67f8d091bf7dbc4fc253293d10900cff64
          git submodule update --init --recursive
          make lib-native-release

      - name: Configure WebGPU build
        shell: bash
        run: |
          cmake -S . -B build-wgpu \
            -DCMAKE_BUILD_TYPE=Release \
            -DG4WGPU_ENABLE_WEBGPU=ON \
            -DG4WGPU_RUN_GPU_TESTS=ON \
            -DG4WGPU_WGPU_NATIVE_INCLUDE_DIR=/tmp/wgpu-native/ffi \
            -DG4WGPU_WEBGPU_HEADER_DIR=/tmp/wgpu-native/ffi/webgpu-headers \
            -DG4WGPU_WGPU_NATIVE_LIBRARY=/tmp/wgpu-native/target/release/libwgpu_native.so

      - name: Compile and link WebGPU backend
        run: cmake --build build-wgpu -j2

      - name: Run CPU regression in WebGPU build
        run: ctest --test-dir build-wgpu -R g4wgpu.cpu_backend --output-on-failure

      - name: Run WebGPU smoke test on software Vulkan
        env:
          LD_LIBRARY_PATH: /tmp/wgpu-native/target/release
          WGPU_BACKEND: vulkan
        run: ctest --test-dir build-wgpu -R g4wgpu.webgpu_backend --output-on-failure


  geant4-compile-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned Geant4 install
        id: geant4-cache
        uses: actions/cache@v4
        with:
          path: /tmp/geant4-install
          key: geant4-${{ runner.os }}-f3d5293d384757b8a228a099898b2b87cfa4023c

      - name: Install Geant4 build prerequisites
        if: steps.geant4-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libexpat1-dev

      - name: Build pinned Geant4 fork
        if: steps.geant4-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone https://github.com/nanodriver999/geant4.git /tmp/geant4
          cd /tmp/geant4
          git checkout f3d5293d384757b8a228a099898b2b87cfa4023c

          cmake -S /tmp/geant4 -B /tmp/geant4-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/geant4-install \
            -DGEANT4_INSTALL_DATA=OFF \
            -DGEANT4_BUILD_MULTITHREADED=ON

          cmake --build /tmp/geant4-build -j2
          cmake --install /tmp/geant4-build

      - name: Save pinned Geant4 install
        if: steps.geant4-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/geant4-install
          key: geant4-${{ runner.os }}-f3d5293d384757b8a228a099898b2b87cfa4023c

      - name: Configure g4wgpu with Geant4
        shell: bash
        run: |
          cmake -S . -B build-g4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DG4WGPU_ENABLE_GEANT4=ON \
            -DGeant4_DIR=/tmp/geant4-install/lib/cmake/Geant4

      - name: Compile and link Geant4 adapter
        run: cmake --build build-g4 -j2

      - name: Run Geant4 and core integration tests
        run: ctest --test-dir build-g4 --output-on-failure --no-tests=error
